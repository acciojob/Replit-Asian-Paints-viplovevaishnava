<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<main class="main-container">
        <header>
            <h1>color changing grid</h1>
        </header>
        <div class="content">

            <section class="grid-container">
                <div class="grid-item" id="1">1</div>
                <div class="grid-item" id="2">2</div>
                <div class="grid-item" id="3">3</div>
                <div class="grid-item" id="4">4</div>
                <div class="grid-item" id="5">5</div>
                <div class="grid-item" id="6">6</div>
                <div class="grid-item" id="7">7</div>
                <div class="grid-item" id="8">8</div>
                <div class="grid-item" id="9">9</div>

            </section>
            <section class="sidebar">
                <form action="colorChange">
                    <input type="number" placeholder="Enter block Number" id="block_id">
                    <input type="text" placeholder="Enter Color Id" id="colour_id">
                    <button type="submit" id="change_button">Submit</button>
                    <button type="reset" id="Reset">reset</button>
                </form>

            </section>
        </div>
    </main>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
